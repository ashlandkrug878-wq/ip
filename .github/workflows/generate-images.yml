name: Pipeline

# Runs whenever board data or the image queue changes:
# 1. rebuild data/index.json for the website
# 2. add base-image jobs for new IPs (skipping 淘汰)
# 3. generate pending images if IMAGE_API_KEY is configured
# Commits made here use GITHUB_TOKEN, which does not retrigger this workflow.

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "queue/image-jobs.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild data index
        run: python scripts/build_index.py
      - name: Queue base images for new IPs
        run: python scripts/build_queue.py
      - name: Collect retirement feedback evidence
        run: python scripts/build_feedback.py
      - name: Generate pending images
        if: "!contains(github.event.head_commit.message, '[skip images]')"
        env:
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          IMAGE_API_URL: ${{ vars.IMAGE_API_URL }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
        run: python scripts/generate_images.py
      - name: Commit results
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add data/index.json data/feedback images queue/image-jobs.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Pipeline: update index, queue and images"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
