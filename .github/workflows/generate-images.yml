name: Generate images

on:
  push:
    paths:
      - "queue/image-jobs.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-images
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate pending images
        env:
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          IMAGE_API_URL: ${{ vars.IMAGE_API_URL }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
        run: python scripts/generate_images.py
      - name: Commit results
        run: |
          git config user.name "image-bot"
          git config user.email "image-bot@users.noreply.github.com"
          git add images queue/image-jobs.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Generate images from queue"
            git push
          fi
